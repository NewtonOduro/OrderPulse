services:
  - type: web
    name: orderpulse
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix Backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix Backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
