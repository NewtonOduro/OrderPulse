services:
  - type: web
    name: orderpulse
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --prefix Backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix Backend
    healthCheckPath: /api/health
    disk:
      name: orderpulse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/restaurant.sqlite
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
